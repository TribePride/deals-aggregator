name: Refresh deals

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-deals
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and score
        run: python3 scripts/refresh.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data feed.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh deals $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
